---
# Native community.openwrt.apk wrapper for OpenWrt 25.12+.

# Packages to install.
apk_packages: []

# Packages to remove.
apk_packages_absent: []

# Refresh the package index before installing. Only done when there is
# actually something to install -- `apk update` costs a few seconds and there
# is no point paying it on a run that changes nothing.
apk_update_cache: true
