---
- name: Validate bridge VLAN section ID
  ansible.builtin.assert:
    that:
      - item.id is defined
      - item.id | length > 0
      - item.id is match('^[A-Za-z0-9_]+$')
    fail_msg: "Bridge VLANs require a stable named id, got {{ item.id | default('undefined') }}"

- name: Validate unique bridge VLAN identity for {{ item.id }}
  community.openwrt.uci:
    command: "find_all"
    config: "network"
    type: "bridge-vlan"
    find:
      device: "{{ item.device }}"
      vlan: "{{ item.vlan }}"
  register: named_section_matches
  changed_when: false
  check_mode: false

- name: Require unique bridge VLAN identity for {{ item.id }}
  ansible.builtin.assert:
    that:
      - named_section_matches.result_list is defined
      - named_section_matches.result_list | length <= 1
    fail_msg: >-
      Bridge VLAN {{ item.device }}/{{ item.vlan }} matched
      {{ named_section_matches.result_list | default([]) }}

- name: Remove bridge VLAN {{ item.id }}
  when: item.state | default('present') == 'absent'
  community.openwrt.uci:
    command: "absent"
    config: "network"
    section: "{{ item.id }}"
    type: "bridge-vlan"
    find:
      device: "{{ item.device }}"
      vlan: "{{ item.vlan }}"

- name: Configure bridge VLAN {{ item.id }}
  when: item.state | default('present') == 'present'
  community.openwrt.uci:
    command: "section"
    config: "network"
    type: "bridge-vlan"
    name: "{{ item.id }}"
    find:
      device: "{{ item.device }}"
      vlan: "{{ item.vlan }}"
    set_find: true
    value:
      ports: "{{ item.ports | default(omit) }}"
