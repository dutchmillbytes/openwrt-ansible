---
- name: Validate network rule section ID
  ansible.builtin.assert:
    that:
      - item.id is defined
      - item.id | length > 0
      - item.id is match('^[A-Za-z0-9_]+$')
      - item.find is defined
      - item.find is mapping
      - item.find | length > 0
    fail_msg: >-
      Network rules require a stable named id and nonempty semantic find map,
      got id={{ item.id | default('undefined') }} and
      find={{ item.find | default('undefined') }}

- name: Validate unique network rule identity for {{ item.id }}
  community.openwrt.uci:
    command: "find_all"
    config: "network"
    type: "rule"
    find: "{{ item.find }}"
  register: named_section_matches
  changed_when: false
  check_mode: false

- name: Require unique network rule identity for {{ item.id }}
  ansible.builtin.assert:
    that:
      - named_section_matches.result_list is defined
      - named_section_matches.result_list | length <= 1
    fail_msg: >-
      Network rule identity {{ item.find }} matched
      {{ named_section_matches.result_list | default([]) }}

- name: Remove network rule {{ item.id }}
  when: item.state | default('present') == 'absent'
  community.openwrt.uci:
    command: "absent"
    config: "network"
    section: "{{ item.id }}"
    type: "rule"
    find: "{{ item.find | default(omit) }}"

- name: Configure network rule {{ item.id }}
  when: item.state | default('present') == 'present'
  community.openwrt.uci:
    command: "section"
    config: "network"
    type: "rule"
    name: "{{ item.id }}"
    find: "{{ item.find | default(omit) }}"
    set_find: true
    value:
      mark: "{{ item.mark | default(omit) }}"
      in: "{{ item.in | default(omit) }}"
      out: "{{ item.out | default(omit) }}"
      src: "{{ item.src | default(omit) }}"
      dest: "{{ item.dest | default(omit) }}"
      invert: "{{ item.invert | default(omit) }}"
      priority: "{{ item.priority | default(omit) }}"
      lookup: "{{ item.lookup | default(omit) }}"
      goto: "{{ item.goto | default([]) | join(' ') }}"
      action: "{{ item.action | default(omit) }}"
      disabled: "{{ item.disabled | default(omit) }}"
