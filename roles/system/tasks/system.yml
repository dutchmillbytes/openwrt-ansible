---
- name: Validate system section ID
  ansible.builtin.assert:
    that:
      - system_section_id | length > 0
      - system_section_id is match('^[A-Za-z0-9_]+$')

- name: Find system singleton sections
  community.openwrt.uci:
    command: "find_all"
    config: "system"
    type: "system"
    find: {}
  register: named_section_matches
  changed_when: false
  check_mode: false

- name: Require a unique system singleton
  ansible.builtin.assert:
    that:
      - named_section_matches.result_list is defined
      - named_section_matches.result_list | length <= 1
    fail_msg: "Multiple system sections found: {{ named_section_matches.result_list | default([]) }}"

# Configure system settings
- name: Configure system settings
  community.openwrt.uci:
    command: "section"
    config: "system"
    type: "system"
    name: "{{ system_section_id }}"
    find: {}
    set_find: true
    value:
      hostname: "{{ system.hostname | default(omit) }}"
      description: "{{ system.description | default(omit) }}"
      klogconloglevel: "{{ system.klogconloglevel | default(omit) }}"
      log_file: "{{ system.log_file | default(omit) }}"
      log_hostname: "{{ system.log_hostname | default(omit) }}"
      log_ip: "{{ system.log_ip | default(omit) }}"
      log_port: "{{ system.log_port | default(omit) }}"
      log_proto: "{{ system.log_proto | default(omit) }}"
      log_remote: "{{ system.log_remote | default(omit) }}"
      log_size: "{{ system.log_size | default(omit) }}"
      log_type: "{{ system.log_type | default(omit) }}"
      timezone: "{{ system.timezone | default(omit) }}"
      zonename: "{{ system.zonename | default(omit) }}"
