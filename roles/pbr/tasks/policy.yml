---
- name: Validate PBR policy section ID
  ansible.builtin.assert:
    that:
      - item.id is defined
      - item.id | length > 0
      - item.id is match('^[A-Za-z0-9_]+$')
    fail_msg: "PBR policies require a stable named id, got {{ item.id | default('undefined') }}"

- name: Validate unique PBR policy identity for {{ item.id }}
  community.openwrt.uci:
    command: "find_all"
    config: "pbr"
    type: "policy"
    find:
      name: "{{ item.name }}"
  register: named_section_matches
  changed_when: false
  check_mode: false

- name: Require unique PBR policy identity for {{ item.id }}
  ansible.builtin.assert:
    that:
      - named_section_matches.result_list is defined
      - named_section_matches.result_list | length <= 1
    fail_msg: "Policy name {{ item.name }} matched {{ named_section_matches.result_list | default([]) }}"

- name: Remove PBR policy {{ item.id }}
  when: item.state | default('present') == 'absent'
  community.openwrt.uci:
    command: "absent"
    config: "pbr"
    section: "{{ item.id }}"
    type: "policy"
    find:
      name: "{{ item.name }}"

- name: Configure PBR policy {{ item.id }}
  when: item.state | default('present') == 'present'
  community.openwrt.uci:
    command: "section"
    config: "pbr"
    type: "policy"
    name: "{{ item.id }}"
    find:
      name: "{{ item.name }}"
    set_find: true
    value:
      enabled: "{{ item.enabled | default(omit) }}"
      interface: "{{ item.interface | default(omit) }}"
      src_addr: "{{ item.src_addr | default([]) | join(' ') }}"
      src_port: "{{ item.src_port | default([]) | join(' ') }}"
      dest_addr: "{{ item.dest_addr | default([]) | join(' ') }}"
      dest_port: "{{ item.dest_port | default([]) | join(' ') }}"
      proto: "{{ item.proto | default(omit) }}"
      chain: "{{ item.chain | default(omit) }}"
