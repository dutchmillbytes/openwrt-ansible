---
# acme section
# Option names below are taken from the acme-common init script, not from the
# OpenWrt wiki. In particular there is no `update_uhttpd` option -- wiring a
# certificate into uhttpd is a separate concern.
acme_section_id: "main"

acme:
  account_email: ""
  debug: ""

# cert sections
#
# Certificates are written to /etc/ssl/acme/ (CERT_DIR in the init script).
# `state_dir` is deprecated and deliberately absent here.
#
# `domains` and `credentials` are UCI *lists* -- they are passed through as
# lists, never joined into a string.
acme_certs: []

# Obtain certificates during the play rather than waiting for the nightly
# cron. Restarting the acme service only registers the cron entry; it does not
# issue anything.
acme_issue_now: true

# Seconds to wait for issuance to complete before failing.
acme_issue_timeout: 120

# Main domain of the certificate this role should wait for and serve. Defaults
# to the first domain of the first cert section.
acme_main_domain: "{{ (acme_certs | default([]) | selectattr('domains', 'defined') | map(attribute='domains') | first | default([]))[0] | default('') }}"

acme_issue_cert_path: "/etc/ssl/acme/{{ acme_main_domain }}.fullchain.crt"

# uhttpd integration
#
# Off by default. When enabled, uhttpd is pointed at the issued certificate and
# a hotplug hook is installed so it reloads on every renewal. There is no
# `update_uhttpd` option in the acme package itself -- this is the role's own.
acme_uhttpd_enabled: false

# UCI section in /etc/config/uhttpd to update.
acme_uhttpd_section: "main"

# Main domain of the certificate to serve.
acme_uhttpd_domain: "{{ acme_main_domain }}"

# fullchain rather than the bare leaf: it includes the intermediate, so a
# client trusting only the root can still build a path.
acme_uhttpd_cert: "/etc/ssl/acme/{{ acme_uhttpd_domain }}.fullchain.crt"
acme_uhttpd_key: "/etc/ssl/acme/{{ acme_uhttpd_domain }}.key"

# Force HTTPS -- uhttpd's `redirect_https`, which bounces every plain-HTTP
# request to the same URL over TLS.
#
# On by default, because there is little point issuing a certificate, serving
# it, and then leaving the web UI reachable in the clear. It only takes effect
# once the certificate exists and uhttpd has actually been pointed at it, so
# turning it on cannot strand a device on a self-signed certificate.
#
# The role owns this option: false writes `redirect_https='0'` rather than
# leaving whatever is on the device.
acme_uhttpd_redirect_https: true
