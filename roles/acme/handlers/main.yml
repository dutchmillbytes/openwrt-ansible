---
# Reload acme service
#
# Restarting registers the nightly renewal cron. It does NOT issue anything --
# the service prints "Nightly certificate renewal enabled" and exits. Obtaining
# a certificate is `/etc/init.d/acme renew`, handled by tasks/issue.yml.
- name: Reload acme
  community.openwrt.service:
    name: "acme"
    state: "restarted"
    enabled: true

# Reload uhttpd service
- name: Reload uhttpd
  community.openwrt.service:
    name: "uhttpd"
    state: "reloaded"
