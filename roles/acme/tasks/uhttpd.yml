---
# Configure the web server only after a certificate is available. In check
# mode first issuance is deferred, so missing certificates defer this block.
- name: Preflight uhttpd section identities
  ansible.builtin.include_role:
    name: uci_migration
  vars:
    uci_migration_selected_packages: ["uhttpd"]
  when: "'uhttpd' not in (uci_migration_prepared_packages | default([]))"

- name: Check whether the certificate has been issued
  community.openwrt.stat:
    path: "{{ acme_uhttpd_cert }}"
  register: acme_uhttpd_cert_stat

- name: Report that uhttpd wiring is deferred
  ansible.builtin.debug:
    msg: >-
      {{ acme_uhttpd_cert }} does not exist yet, so uhttpd is left alone.
      Issuance runs in the background; re-run this play once it has completed
      to point uhttpd at the certificate.
  when: not acme_uhttpd_cert_stat.stat.exists

- name: Configure uhttpd to use the acme certificate
  when: acme_uhttpd_cert_stat.stat.exists
  block:
    # A redirect to a port nothing listens on takes the web UI away entirely,
    # and on a device reached only over the network that is not recoverable
    # without console access. Stock OpenWrt ships listen_https, but a hardened
    # or hand-edited uhttpd may not have it, so check rather than assume.
    - name: Check that uhttpd listens for HTTPS
      community.openwrt.command:
        cmd: "uci -q get uhttpd.{{ acme_uhttpd_section }}.listen_https"
      register: acme_uhttpd_listen
      failed_when: false
      changed_when: false
      # Read-only, and must run under --check too -- otherwise it is skipped,
      # the register is empty, and the assertion below fails for the wrong
      # reason.
      check_mode: false
      when: acme_uhttpd_redirect_https | default(true) | bool

    - name: Assert uhttpd has an HTTPS listener before forcing HTTPS
      ansible.builtin.assert:
        that: acme_uhttpd_listen.stdout | default('') | trim | length > 0
        success_msg: "uhttpd listens for HTTPS on {{ acme_uhttpd_listen.stdout | default('') | trim }}"
        fail_msg: >-
          acme_uhttpd_redirect_https is on, but uhttpd.{{ acme_uhttpd_section }}
          has no listen_https. Forcing HTTPS would redirect every request to a
          port nothing is listening on and lock the web UI out. Add a listener
          first (`uci add_list uhttpd.{{ acme_uhttpd_section }}.listen_https='0.0.0.0:443'`)
          or set acme_uhttpd_redirect_https to false.
      when: acme_uhttpd_redirect_https | default(true) | bool

    # fullchain, not the bare leaf: it carries the intermediate, so a client
    # that trusts only the root can still build a path.
    #
    # redirect_https is set in the same commit as the certificate, so HTTP is
    # only forced to TLS at the moment uhttpd starts serving something valid.
    # It does not break renewals: http-01 challenges are answered on port 80,
    # and ACME servers follow the redirect to HTTPS without verifying the
    # certificate they are offered on the way.
    - name: Point uhttpd at the acme certificate
      community.openwrt.uci:
        command: "set"
        config: "uhttpd"
        section: "{{ acme_uhttpd_section }}"
        type: "uhttpd"
        value:
          cert: "{{ acme_uhttpd_cert }}"
          key: "{{ acme_uhttpd_key }}"
          redirect_https: "{{ '1' if acme_uhttpd_redirect_https | default(true) | bool else '0' }}"
      notify: Reload uhttpd

    - name: Commit uhttpd changes
      community.openwrt.uci:
        command: "commit"
        config: "uhttpd"
      notify: Reload uhttpd

# acme-common runs `hotplug-call acme` on issuance and renewal. Without a hook
# uhttpd would keep serving the old certificate after every renewal.
- name: Install the uhttpd reload hook
  community.openwrt.copy:
    src: "50-uhttpd"
    dest: "/etc/hotplug.d/acme/50-uhttpd"
    owner: "root"
    group: "root"
    mode: "0755"
