---
- name: Select the certificate managed by immediate issuance
  ansible.builtin.set_fact:
    acme_issue_spec: "{{ acme_certs | selectattr('domains', 'defined') | selectattr('domains', 'contains', acme_main_domain) | first }}"

- name: Validate immediate issuance configuration
  ansible.builtin.assert:
    that:
      - acme_issue_spec.domains | length > 0
      - acme_issue_spec.domains[0] == acme_main_domain
      - acme_issue_spec.enabled | default('1') | string == '1'
      - acme_issue_spec.state | default('present') == 'present'
      - acme_issue_spec.domains | select('match', '^[A-Za-z0-9][A-Za-z0-9.*-]*$') | list | length == acme_issue_spec.domains | length
      - acme_issue_spec.key_type | default('ec256') is match('^(ec(256|384|521)|rsa(2048|3072|4096))$')

- name: Build the read-only certificate validation command
  ansible.builtin.set_fact:
    acme_certificate_check_cmd: >-
      /bin/sh -c {{ lookup('file', role_path ~ '/files/check-certificate.sh') | quote }} --
      {{ acme_issue_cert_path | quote }} {{ (acme_issue_spec.days | default(10) | int) * 86400 }}
      {{ acme_issue_spec.domains | map('quote') | join(' ') }}

- name: Check actual certificate names and remaining validity
  community.openwrt.command:
    cmd: "{{ acme_certificate_check_cmd }}"
    uses_shell: true
  check_mode: false
  changed_when: false
  failed_when: acme_certificate_check.rc not in [0, 1, 2]
  register: acme_certificate_check

- name: Require OpenSSL for certificate validation
  ansible.builtin.assert:
    that: acme_certificate_check.rc != 2 or ansible_check_mode
    fail_msg: Install openssl-util before running the ACME role.

- name: Report certificate work during check mode
  ansible.builtin.debug:
    msg: Certificate issuance or SAN/validity verification is required; deferred in check mode.
  changed_when: true
  when:
    - ansible_check_mode
    - acme_certificate_check.rc != 0

- name: Reconcile certificate content
  when:
    - not ansible_check_mode
    - acme_certificate_check.rc == 1
  block:
    - name: Check whether an issued certificate already exists
      community.openwrt.stat:
        path: "{{ acme_issue_cert_path }}"
      register: acme_existing_cert

    - name: Validate reissuance support before changing existing certificate state
      ansible.builtin.assert:
        that:
          - acme_issue_spec.validation_method | default('webroot') == 'webroot'
          - acme_issue_spec.staging | default('0') | string == '0'
          - acme_issue_spec.acme_server | default('') | length > 0
        fail_msg: Immediate reissuance supports production webroot certificates with an explicit ACME server.
      when: acme_existing_cert.stat.exists

    - name: Reissue existing webroot certificate with the desired SANs
      community.openwrt.command:
        cmd: >-
          /bin/sh -c {{ lookup('template', role_path ~ '/templates/reissue.sh.j2') | quote }}
        uses_shell: true
      when: acme_existing_cert.stat.exists
      changed_when: true
      no_log: true
      diff: false

    - name: Trigger first issuance through the package integration
      community.openwrt.command:
        cmd: /etc/init.d/acme renew
      changed_when: true
      when: not acme_existing_cert.stat.exists

    - name: Wait for a certificate with the requested SANs and validity
      community.openwrt.command:
        cmd: "{{ acme_certificate_check_cmd }}"
        uses_shell: true
      register: acme_issue_wait
      changed_when: false
      until: acme_issue_wait.rc == 0
      retries: "{{ [1, acme_issue_timeout | int // 2] | max }}"
      delay: 2
      notify: Reload uhttpd
