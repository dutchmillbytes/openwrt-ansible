---
# Get rootfs block device name
- name: Get rootfs block device name
  community.openwrt.command:
    cmd: 'sed -n -e "/\s\/overlay\s.*$/s///p" /etc/mtab'
  register: rootfs_block_device_name
  changed_when: rootfs_block_device_name.rc != 0

# Set rootfs block device name fact
- name: Set rootfs block device name fact
  ansible.builtin.set_fact:
    block_device_name: "{{ rootfs_block_device_name.stdout }}"

# Mount rootfs data to another directory
- name: Validate unique rootfs data mount identity
  community.openwrt.uci:
    command: "find_all"
    config: "fstab"
    type: "mount"
    find:
      target: "/rwm"
  register: named_section_matches
  changed_when: false
  check_mode: false

- name: Require unique rootfs data mount identity
  ansible.builtin.assert:
    that:
      - named_section_matches.result_list is defined
      - named_section_matches.result_list | length <= 1
    fail_msg: "Mount target /rwm matched {{ named_section_matches.result_list | default([]) }}"

- name: Configure rootfs data mount
  community.openwrt.uci:
    command: "section"
    config: "fstab"
    type: "mount"
    name: "rwm"
    find:
      target: "/rwm"
    set_find: true
    value:
      device: "{{ block_device_name }}"

# Get external USB device UUID
- name: Get external usb device uuid
  community.openwrt.command:
    cmd: 'block info /dev/{{ extroot_device }}1 | grep -o -e "UUID=\S*"'
  register: external_usb_device_uuid
  changed_when: external_usb_device_uuid.rc != 0

# Set external usb device uuid fact
- name: Set external usb device uuid fact
  ansible.builtin.set_fact:
    usb_device_uuid: '{{ external_usb_device_uuid.stdout | regex_search(''(?<=")(.*?)(?=")'') }}'

# Mount external USB as overlayfs
- name: Validate unique overlay mount identity
  community.openwrt.uci:
    command: "find_all"
    config: "fstab"
    type: "mount"
    find:
      target: "/overlay"
  register: named_section_matches
  changed_when: false
  check_mode: false

- name: Require unique overlay mount identity
  ansible.builtin.assert:
    that:
      - named_section_matches.result_list is defined
      - named_section_matches.result_list | length <= 1
    fail_msg: "Mount target /overlay matched {{ named_section_matches.result_list | default([]) }}"

- name: Configure external USB overlay mount
  community.openwrt.uci:
    command: "section"
    config: "fstab"
    type: "mount"
    name: "overlay"
    find:
      target: "/overlay"
    set_find: true
    value:
      uuid: "{{ usb_device_uuid }}"
