---
# No --no-check-certificate: this only succeeds if the device genuinely trusts
# the chain, which is the whole point of the role.
- name: Fetch {{ ca_trust_verify_url }} to prove the chain validates
  community.openwrt.command:
    cmd: "wget -q -T 8 -O /dev/null {{ ca_trust_verify_url }}"
  register: ca_trust_verify
  failed_when: false
  changed_when: false
  check_mode: false
  # Retried because this often runs moments after a dnsmasq restart. A device
  # whose resolver has just been bounced needs a few seconds before names
  # resolve again, and a single attempt reports a trust failure that is really
  # a DNS timing race.
  retries: 5
  delay: 3
  until: ca_trust_verify.rc == 0

- name: Assert the CA is trusted
  ansible.builtin.assert:
    that: ca_trust_verify.rc | default(1) == 0
    success_msg: "{{ ca_trust_verify_url }} validated against the installed root CA"
    fail_msg: >-
      Root CA installed, but {{ ca_trust_verify_url }} still fails verification
      (rc={{ ca_trust_verify.rc }}). Check that the CA is reachable and that the
      chain it presents terminates at one of the installed roots.
