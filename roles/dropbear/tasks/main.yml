---
- name: Preflight and name dropbear sections
  ansible.builtin.include_role:
    name: uci_migration
  vars:
    uci_migration_selected_packages: ["dropbear"]
  when: "'dropbear' not in (uci_migration_prepared_packages | default([]))"

# Install SSH authorized keys
#
# Before the dropbear settings, not after: if a settings change is going to
# cost you access -- PasswordAuth off, Interface narrowed, Port moved -- the
# keys should already be on the device when it takes effect.
- name: Configure ssh authorized keys
  ansible.builtin.include_tasks: keys.yml

# Configure dropbear section
- name: Configure dropbear section
  ansible.builtin.include_tasks: dropbear.yml

# Apply changes and reload dropbear service
- name: Apply changes and reload dropbear
  community.openwrt.uci:
    command: commit
    config: "dropbear"
  notify: Reload dropbear
