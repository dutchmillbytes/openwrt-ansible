---
- name: Validate dnsmasq section ID
  ansible.builtin.assert:
    that:
      - dhcp_dnsmasq_section_id | length > 0
      - dhcp_dnsmasq_section_id is match('^[A-Za-z0-9_]+$')

- name: Find dnsmasq singleton sections
  community.openwrt.uci:
    command: "find_all"
    config: "dhcp"
    type: "dnsmasq"
    find: {}
  register: named_section_matches
  changed_when: false
  check_mode: false

- name: Require a unique dnsmasq singleton
  ansible.builtin.assert:
    that:
      - named_section_matches.result_list is defined
      - named_section_matches.result_list | length <= 1
    fail_msg: "Multiple dnsmasq sections found: {{ named_section_matches.result_list | default([]) }}"

# Configure common options
- name: Configure common options
  community.openwrt.uci:
    command: "section"
    config: "dhcp"
    type: "dnsmasq"
    name: "{{ dhcp_dnsmasq_section_id }}"
    find: {}
    set_find: true
    value:
      authoritative: "{{ dhcp_common.authoritative | default(omit) }}"
      boguspriv: "{{ dhcp_common.boguspriv | default(omit) }}"
      cachesize: "{{ dhcp_common.cachesize | default(omit) }}"
      domain: "{{ dhcp_common.domain | default(omit) }}"
      domainneeded: "{{ dhcp_common.domainneeded | default(omit) }}"
      dnssec: "{{ dhcp_common.dnssec | default(omit) }}"
      dnsseccheckunsigned: "{{ dhcp_common.dnsseccheckunsigned | default(omit) }}"
      expandhosts: "{{ dhcp_common.expandhosts | default(omit) }}"
      filterwin2k: "{{ dhcp_common.filterwin2k | default(omit) }}"
      fqdn: "{{ dhcp_common.fqdn | default(omit) }}"
      leasefile: "{{ dhcp_common.leasefile | default(omit) }}"
      local: "{{ dhcp_common.local | default(omit) }}"
      localise_queries: "{{ dhcp_common.localise_queries | default(omit) }}"
      localservice: "{{ dhcp_common.localservice | default(omit) }}"
      nonegcache: "{{ dhcp_common.nonegcache | default(omit) }}"
      nonwildcard: "{{ dhcp_common.nonwildcard | default(omit) }}"
      readethers: "{{ dhcp_common.readethers | default(omit) }}"
      rebind_protection: "{{ dhcp_common.rebind_protection | default(omit) }}"
      rebind_localhost: "{{ dhcp_common.rebind_localhost | default(omit) }}"
      # These four are UCI *lists*, not options. Pass the list through rather
      # than joining it: the uci module writes an array as a real `list`, and
      # OpenWrt's dnsmasq init reads them with config_list_foreach, which
      # silently ignores an `option`. Joining produced
      # `option rebind_domain '/example/'`, which never reached dnsmasq at all.
      rebind_domain: "{{ dhcp_common.rebind_domain | default(omit) }}"
      server: "{{ dhcp_common.server | default(omit) }}"
      address: "{{ dhcp_common.address | default(omit) }}"
      serverlist: "{{ dhcp_common.serverlist | default(omit) }}"
      # resolvfile is a plain option; joining it split a string per character.
      resolvfile: "{{ dhcp_common.resolvfile | default(omit) }}"
      allservers: "{{ dhcp_common.allservers | default(omit) }}"
