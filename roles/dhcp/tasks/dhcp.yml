---
- name: Validate DHCP pool section ID
  ansible.builtin.assert:
    that:
      - item.id is defined
      - item.id | length > 0
      - item.id is match('^[A-Za-z0-9_]+$')
    fail_msg: "DHCP pools require a stable named id, got {{ item.id | default('undefined') }}"

- name: Validate unique DHCP pool identity for {{ item.id }}
  community.openwrt.uci:
    command: "find_all"
    config: "dhcp"
    type: "dhcp"
    find:
      interface: "{{ item.interface }}"
  register: named_section_matches
  changed_when: false
  check_mode: false

- name: Require unique DHCP pool identity for {{ item.id }}
  ansible.builtin.assert:
    that:
      - named_section_matches.result_list is defined
      - named_section_matches.result_list | length <= 1
    fail_msg: >-
      DHCP interface {{ item.interface }} matched
      {{ named_section_matches.result_list | default([]) }}

- name: Remove DHCP pool {{ item.id }}
  when: item.state | default('present') == 'absent'
  community.openwrt.uci:
    command: "absent"
    config: "dhcp"
    section: "{{ item.id }}"
    type: "dhcp"
    find:
      interface: "{{ item.interface }}"

- name: Configure DHCP pool {{ item.id }}
  when: item.state | default('present') == 'present'
  community.openwrt.uci:
    command: "section"
    config: "dhcp"
    type: "dhcp"
    name: "{{ item.id }}"
    find:
      interface: "{{ item.interface }}"
    set_find: true
    value:
      ignore: "{{ item.ignore | default(omit) }}"
      dhcp_option: "{{ item.dhcp_option | default([]) | join(' ') }}"
      force: "{{ item.force | default(omit) }}"
      dhcpv4: "{{ item.dhcpv4 | default(omit) }}"
      leasetime: "{{ item.leasetime | default(omit) }}"
      limit: "{{ item.limit | default(omit) }}"
      start: "{{ item.start | default(omit) }}"
      ra: "{{ item.ra | default(omit) }}"
      dhcpv6: "{{ item.dhcpv6 | default(omit) }}"
      dns_service: "{{ item.dns_service | default(omit) }}"
