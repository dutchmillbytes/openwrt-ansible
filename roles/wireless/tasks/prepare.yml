---
# Remove non-mesh wpad packages
- name: Remove non-mesh wpad packages
  community.openwrt.opkg:
    name: "{{ item }}"
    state: "absent"
  loop: "{{ non_mesh_pkgs }}"

# Update opkg cache
- name: Update opkg cache
  community.openwrt.command:
    cmd: "opkg update"
  changed_when: false

# Install mesh packages
- name: Install mesh packages
  community.openwrt.opkg:
    name: "{{ item }}"
    state: "present"
  loop: "{{ mesh_pkgs }}"
