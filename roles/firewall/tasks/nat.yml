---
- name: Validate firewall NAT section ID
  ansible.builtin.assert:
    that:
      - item.id is defined
      - item.id | length > 0
      - item.id is match('^[A-Za-z0-9_]+$')
    fail_msg: "Firewall NAT entries require a stable named id, got {{ item.id | default('undefined') }}"

- name: Validate unique firewall NAT identity for {{ item.id }}
  community.openwrt.uci:
    command: "find_all"
    config: "firewall"
    type: "nat"
    find:
      name: "{{ item.name }}"
  register: named_section_matches
  changed_when: false
  check_mode: false

- name: Require unique firewall NAT identity for {{ item.id }}
  ansible.builtin.assert:
    that:
      - named_section_matches.result_list is defined
      - named_section_matches.result_list | length <= 1
    fail_msg: "NAT name {{ item.name }} matched {{ named_section_matches.result_list | default([]) }}"

- name: Remove firewall NAT entry {{ item.id }}
  when: item.state | default('present') == 'absent'
  community.openwrt.uci:
    command: "absent"
    config: "firewall"
    section: "{{ item.id }}"
    type: "nat"
    find:
      name: "{{ item.name }}"

- name: Configure firewall NAT entry {{ item.id }}
  when: item.state | default('present') == 'present'
  community.openwrt.uci:
    command: "section"
    config: "firewall"
    type: "nat"
    name: "{{ item.id }}"
    find:
      name: "{{ item.name }}"
    set_find: true
    value:
      src: "{{ item.src | default(omit) }}"
      src_ip: "{{ item.src_ip | default(omit) }}"
      src_port: "{{ item.src_port | default(omit) }}"
      dest_ip: "{{ item.dest_ip | default(omit) }}"
      dest_port: "{{ item.dest_port | default(omit) }}"
      snat_ip: "{{ item.snat_ip | default(omit) }}"
      snat_port: "{{ item.snat_port | default(omit) }}"
      target: "{{ item.target | default(omit) }}"
      proto: "{{ item.proto | default([]) | join(' ') }}"
      family: "{{ item.family | default(omit) }}"
      mark: "{{ item.mark | default(omit) }}"
      enabled: "{{ item.enabled | default(omit) }}"
