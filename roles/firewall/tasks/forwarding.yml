---
- name: Validate firewall forwarding section ID
  ansible.builtin.assert:
    that:
      - item.id is defined
      - item.id | length > 0
      - item.id is match('^[A-Za-z0-9_]+$')
    fail_msg: "Firewall forwardings require a stable named id, got {{ item.id | default('undefined') }}"

- name: Validate unique firewall forwarding identity for {{ item.id }}
  community.openwrt.uci:
    command: "find_all"
    config: "firewall"
    type: "forwarding"
    find:
      src: "{{ item.src }}"
      dest: "{{ item.dest }}"
  register: named_section_matches
  changed_when: false
  check_mode: false

- name: Require unique firewall forwarding identity for {{ item.id }}
  ansible.builtin.assert:
    that:
      - named_section_matches.result_list is defined
      - named_section_matches.result_list | length <= 1
    fail_msg: >-
      Forwarding {{ item.src }} to {{ item.dest }} matched
      {{ named_section_matches.result_list | default([]) }}

- name: Remove firewall forwarding {{ item.id }}
  when: item.state | default('present') == 'absent'
  community.openwrt.uci:
    command: "absent"
    config: "firewall"
    section: "{{ item.id }}"
    type: "forwarding"
    find:
      src: "{{ item.src }}"
      dest: "{{ item.dest }}"

- name: Configure firewall forwarding {{ item.id }}
  when: item.state | default('present') == 'present'
  community.openwrt.uci:
    command: "section"
    config: "firewall"
    type: "forwarding"
    name: "{{ item.id }}"
    find:
      src: "{{ item.src }}"
      dest: "{{ item.dest }}"
    set_find: true
    value:
      family: "{{ item.family | default(omit) }}"
      ipset: "{{ item.ipset | default(omit) }}"
      enabled: "{{ item.enabled | default(omit) }}"
