---
- name: Validate firewall defaults section ID
  ansible.builtin.assert:
    that:
      - firewall_defaults_section_id | length > 0
      - firewall_defaults_section_id is match('^[A-Za-z0-9_]+$')

- name: Find firewall defaults sections
  community.openwrt.uci:
    command: "find_all"
    config: "firewall"
    type: "defaults"
    find: {}
  register: named_section_matches
  changed_when: false
  check_mode: false

- name: Require unique firewall defaults
  ansible.builtin.assert:
    that:
      - named_section_matches.result_list is defined
      - named_section_matches.result_list | length <= 1
    fail_msg: "Multiple firewall defaults sections found: {{ named_section_matches.result_list | default([]) }}"

# Configure defaults settings
- name: Configure defaults settings
  community.openwrt.uci:
    command: "section"
    config: "firewall"
    type: "defaults"
    name: "{{ firewall_defaults_section_id }}"
    find: {}
    set_find: true
    value:
      input: "{{ firewall_defaults.input | default(omit) }}"
      forward: "{{ firewall_defaults.forward | default(omit) }}"
      output: "{{ firewall_defaults.output | default(omit) }}"
      drop_invalid: "{{ firewall_defaults.drop_invalid | default(omit) }}"
      synflood_protect: "{{ firewall_defaults.synflood_protect | default(omit) }}"
      synflood_rate: "{{ firewall_defaults.synflood_rate | default(omit) }}"
      synflood_burst: "{{ firewall_defaults.synflood_burst | default(omit) }}"
      flow_offloading: "{{ firewall_defaults.flow_offloading | default(omit) }}"
      flow_offloading_hw: "{{ firewall_defaults.flow_offloading_hw | default(omit) }}"
