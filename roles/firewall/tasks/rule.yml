---
- name: Validate firewall rule section ID
  ansible.builtin.assert:
    that:
      - item.id is defined
      - item.id | length > 0
      - item.id is match('^[A-Za-z0-9_]+$')
    fail_msg: "Firewall rules require a stable named id, got {{ item.id | default('undefined') }}"

- name: Validate unique firewall rule identity for {{ item.id }}
  community.openwrt.uci:
    command: "find_all"
    config: "firewall"
    type: "rule"
    find:
      name: "{{ item.name }}"
  register: named_section_matches
  changed_when: false
  check_mode: false

- name: Require unique firewall rule identity for {{ item.id }}
  ansible.builtin.assert:
    that:
      - named_section_matches.result_list is defined
      - named_section_matches.result_list | length <= 1
    fail_msg: "Rule name {{ item.name }} matched {{ named_section_matches.result_list | default([]) }}"

- name: Remove firewall rule {{ item.id }}
  when: item.state | default('present') == 'absent'
  community.openwrt.uci:
    command: "absent"
    config: "firewall"
    section: "{{ item.id }}"
    type: "rule"
    find:
      name: "{{ item.name }}"

- name: Configure firewall rule {{ item.id }}
  when: item.state | default('present') == 'present'
  community.openwrt.uci:
    command: "section"
    config: "firewall"
    type: "rule"
    name: "{{ item.id }}"
    find:
      name: "{{ item.name }}"
    set_find: true
    value:
      src: "{{ item.src | default(omit) }}"
      src_ip: "{{ item.src_ip | default(omit) }}"
      src_port: "{{ item.src_port | default([]) | join(' ') }}"
      src_mac: "{{ item.src_mac | default(omit) }}"
      dest: "{{ item.dest | default(omit) }}"
      dest_ip: "{{ item.dest_ip | default(omit) }}"
      dest_port: "{{ item.dest_port | default([]) | join(' ') }}"
      target: "{{ item.target | default(omit) }}"
      proto: "{{ item.proto | default([]) | join(' ') }}"
      family: "{{ item.family | default(omit) }}"
      ipset: "{{ item.ipset | default(omit) }}"
      mark: "{{ item.mark | default(omit) }}"
      set_mark: "{{ item.set_mark | default(omit) }}"
      enabled: "{{ item.enabled | default(omit) }}"
