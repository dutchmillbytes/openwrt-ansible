---
- name: Validate firewall ipset section ID
  ansible.builtin.assert:
    that:
      - item.id is defined
      - item.id | length > 0
      - item.id is match('^[A-Za-z0-9_]+$')
    fail_msg: "Firewall ipsets require a stable named id, got {{ item.id | default('undefined') }}"

- name: Validate unique firewall ipset identity for {{ item.id }}
  community.openwrt.uci:
    command: "find_all"
    config: "firewall"
    type: "ipset"
    find:
      name: "{{ item.name }}"
  register: named_section_matches
  changed_when: false
  check_mode: false

- name: Require unique firewall ipset identity for {{ item.id }}
  ansible.builtin.assert:
    that:
      - named_section_matches.result_list is defined
      - named_section_matches.result_list | length <= 1
    fail_msg: "IP set name {{ item.name }} matched {{ named_section_matches.result_list | default([]) }}"

- name: Remove firewall ipset {{ item.id }}
  when: item.state | default('present') == 'absent'
  community.openwrt.uci:
    command: "absent"
    config: "firewall"
    section: "{{ item.id }}"
    type: "ipset"
    find:
      name: "{{ item.name }}"

- name: Configure firewall ipset {{ item.id }}
  when: item.state | default('present') == 'present'
  community.openwrt.uci:
    command: "section"
    config: "firewall"
    type: "ipset"
    name: "{{ item.id }}"
    find:
      name: "{{ item.name }}"
    set_find: true
    value:
      comment: "{{ item.comment | default(omit) }}"
      match: "{{ item.match | default([]) | join(' ') }}"
      entry: "{{ item.entry | default([]) | join(' ') }}"
      family: "{{ item.family | default(omit) }}"
      maxelem: "{{ item.maxelem | default(omit) }}"
      loadfile: "{{ item.loadfile | default(omit) }}"
      enabled: "{{ item.enabled | default(omit) }}"
