---
- name: Configure openwrt
  hosts: openwrt
  ignore_unreachable: true
  gather_facts: false
  tags: configure_openwrt

  pre_tasks:
    - name: Initialize Python-free OpenWrt modules
      ansible.builtin.import_role:
        name: community.openwrt.init
      tags: always

    - name: Update package cache
      community.openwrt.command:
        cmd: "opkg update"
      changed_when: false

  roles:
    - extroot
    - system
    - network
    - wireless
    - wireguard
    - firewall
    - pbr
    - dropbear
    - dhcp

  post_tasks:
    - name: Reboot device
      community.openwrt.command:
        cmd: "reboot"
      changed_when: false
